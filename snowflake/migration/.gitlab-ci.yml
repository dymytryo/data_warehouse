# Monitor Snowflake migration parity
snowflake_migration_parity:
  stage: scheduled
  script:
    - python snowflake/migration_parity.py
  artifacts:
    when: always
    paths:
      - artifacts/row_comparison.csv
      - artifacts/column_comparison.csv
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $RUN_MIGRATION_PARITY == "true"
